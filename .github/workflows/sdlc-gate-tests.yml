# Runs the ai-native-sdlc gate's own test suites across the OS and Python versions that
# COMPATIBILITY.md claims are verified.
#
# This workflow is what makes that claim true. scripts/test_support_matrix.py asserts that
# every entry in the `support-matrix` block below is actually exercised here, so widening
# the documented matrix without widening this file is a BUILD FAILURE, not a doc nit.
#
# Keep the matrix lists in this file literal (not composed from expressions): the
# consistency test reads them statically, and it cannot resolve ${{ }} expressions.

name: SDLC Gate Tests

on:
  push:
    branches: [main]
    # Filtering pushes is fine: required status checks only apply to pull requests, so a
    # skipped push run cannot block anything.
    paths:
      - 'skills/skills/ai-native-sdlc/**'
      - '.github/workflows/sdlc-gate-tests.yml'
  pull_request:
    # DO NOT add a paths filter here. `gate tests green` is a REQUIRED status check, and a
    # required check whose workflow is path-filtered simply never reports on a PR that
    # touches other files -- GitHub then blocks that PR forever, waiting on a check that
    # can never arrive. Waiting does not help; only removing the filter or the requirement
    # does.
    #
    # This is not hypothetical: PR #48 changed only .github/workflows/release-attest.yml,
    # the filter excluded it, and the PR was permanently BLOCKED with 1/2 required checks
    # reported. The cost of always running is 15 matrix cells on every PR, including
    # doc-only ones. That is the price of a required check that can actually report, and it
    # is the right trade.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: suites (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do NOT cancel siblings on first failure: when a Windows-only or 3.9-only break
      # appears we want the full picture of which cells fail, not just the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the gate test suites
        # bash on all three runners (Windows uses the bundled Git bash) so one script covers
        # the matrix. Exit status is captured per suite rather than piped, because piping
        # through tail/head would report a failing suite as green.
        shell: bash
        working-directory: skills/skills/ai-native-sdlc/scripts
        run: |
          set -uo pipefail
          fail=0
          for t in test_gate test_pretooluse_hook test_ci_gate test_hook_config \
                   test_hardening test_supply_chain test_support_matrix; do
            echo "== $t"
            if python "$t.py"; then
              echo "   PASS $t"
            else
              echo "   FAIL $t"
              fail=1
            fi
          done
          exit $fail

      - name: Mutation proof
        # Only on one cell: the mutation sweep runs every suite 36 times, so running it on
        # all 15 cells would burn ~540 suite executions for no extra signal — the mutations
        # are platform-independent.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        working-directory: skills/skills/ai-native-sdlc/scripts
        run: python mutation_proof.py

  shell-scripts:
    # verify_gate_integrity.sh is bash and is only claimed for POSIX runners, so it is
    # checked separately rather than inside the Windows matrix cells.
    name: shell scripts (POSIX)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the shell scripts
        run: |
          set -euo pipefail
          bash -n skills/skills/ai-native-sdlc/scripts/verify_gate_integrity.sh
          bash -n skills/skills/ai-native-sdlc/scripts/install_enforcement.sh 2>/dev/null || true
          echo "shell syntax OK"

  gate-tests-green:
    # ONE stable check that summarises the whole matrix, so branch protection can require
    # this single name instead of 15 volatile cell names. Renaming or adding a matrix cell
    # would otherwise silently break protection, or leave a required check that no longer
    # exists and blocks every PR forever.
    #
    # if: always() is essential -- without it this job is SKIPPED when a dependency fails,
    # and GitHub treats a skipped required check as PASSING. That would invert the whole
    # point and make the gate advisory. So it always runs and inspects results explicitly.
    name: gate tests green
    runs-on: ubuntu-latest
    needs: [suites, shell-scripts]
    if: always()
    steps:
      - name: Require every matrix cell to have succeeded
        run: |
          set -euo pipefail
          echo "suites:        ${{ needs.suites.result }}"
          echo "shell-scripts: ${{ needs.shell-scripts.result }}"
          # A matrix job's result is 'success' only when EVERY cell succeeded.
          # Treat anything else -- failure, cancelled, skipped -- as not green.
          if [ "${{ needs.suites.result }}" != "success" ] \
             || [ "${{ needs.shell-scripts.result }}" != "success" ]; then
            echo "::error::gate tests are not green — see the individual cells above"
            exit 1
          fi
          echo "all gate test cells green"
